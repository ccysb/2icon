name: Build Windows EXE

# 触发条件：
#   1. 推送代码到主分支（main）—— 自动打版本标签并创建 Release
#   2. 推送版本标签（v*，如 v1.1.0）—— 用该标签创建 Release
# 说明：此前只在 release:published 事件里挂载资源，而仓库从未创建过 Release，
#      因此 Releases 页面始终为空；现在由本工作流负责创建 Release。
on:
  push:
    branches: [main]
    tags: ['v*']

# 编译目标平台：仅 Windows (windows-latest, x64)
# 单文件打包方式：PyInstaller --onefile --windowed
# 产物命名规则：
#   - 生成的单文件可执行程序固定命名为 2icon.exe
#   - 构建产物（Artifact）命名为 2icon-windows-x64
#   - Release 资源文件名固定为 2icon.exe
#   - 主分支构建的版本标签形如 v20261118.42（日期 + run_number）

jobs:
  build-windows:
    name: Build single-file EXE (Windows x64)
    runs-on: windows-latest
    # 创建 Release / 打标签需要向 GITHUB_TOKEN 授予仓库内容写权限
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 使用 uv 管理 Python 与依赖，匹配项目技术栈（uv.lock + pyproject.toml）
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # 安装项目运行依赖（package=false，仅安装依赖不构建自身）
      # 注：pywin32 的 COM 注册（pywin32_postinstall -install）在无提权的 CI 运行器上会失败，
      # 且对 PyInstaller 打包并非必需——相关 DLL 由 PyInstaller 的 pywin32 hook 自动收集。
      - name: Sync dependencies
        run: uv sync --no-dev

      # 在虚拟环境中安装打包工具 PyInstaller
      - name: Install PyInstaller
        run: uv pip install pyinstaller

      # 单文件打包：窗口应用（--windowed 不弹控制台），嵌入 logo.ico 与 tkinterdnd2 数据
      - name: Build single-file EXE with PyInstaller
        run: uv run pyinstaller --noconfirm --onefile --windowed --name "2icon" --icon "logo.ico" --add-data "logo.ico;." --hidden-import pythoncom --hidden-import pywintypes --hidden-import win32com --collect-data tkinterdnd2 --collect-data customtkinter main.py

      # 校验产物存在
      - name: Verify artifact
        run: |
          if (!(Test-Path "dist/2icon.exe")) { Write-Error "dist/2icon.exe not found"; exit 1 }
          Get-Item "dist/2icon.exe" | Select-Object Name, Length

      # 上传构建产物（任意触发均上传，便于下载调试）
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2icon-windows-x64
          path: dist/2icon.exe
          if-no-files-found: error
          retention-days: 30

      # 版本标签：推标签就用该标签名；推主分支则按「日期.run_number」自动生成
      - name: Determine release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "本次发布标签: ${tag}"

      # 创建/更新 Release 并附上 exe（标签不存在时由 action 自动创建）
      - name: Publish Release with EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          files: dist/2icon.exe
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
