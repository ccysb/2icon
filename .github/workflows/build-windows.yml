name: Build Windows EXE

# 触发条件：
#   1. 推送代码到主分支（main）—— 自动打版本标签并创建 Release
#   2. 推送版本标签（v*，如 v20260101.1）—— 用该标签创建 Release
# 产物：
#   - 可执行程序 2icon.exe（Rust release 构建，单文件即可运行）
#   - 便携包 2icon-portable.zip（2icon.exe + logo.ico）
#   - 构建产物（Artifact）2icon-windows-x64

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build release EXE (Windows x64)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 缓存 ~/.cargo 与 target，冷启动要编译 zsui/resvg 等重依赖
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64-release

      - name: Run tests
        run: cargo test --release

      - name: Build release binary
        run: cargo build --release --locked

      - name: Assemble artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/release/icon-tool.exe" "dist/2icon.exe"
          Copy-Item "logo.ico" "dist/logo.ico"
          Compress-Archive -Path "dist/2icon.exe", "dist/logo.ico" -DestinationPath "dist/2icon-portable.zip" -Force
          Get-ChildItem dist | Select-Object Name, Length

      - name: Verify artifact
        shell: pwsh
        run: |
          if (!(Test-Path "dist/2icon.exe")) { Write-Error "dist/2icon.exe not found"; exit 1 }
          $size = (Get-Item "dist/2icon.exe").Length
          if ($size -lt 1MB) { Write-Error "dist/2icon.exe 体积异常: $size 字节"; exit 1 }
          Write-Host "2icon.exe: $size 字节"

      # exe 图标靠 build.rs 调 rc.exe / llvm-rc / windres 嵌入；
      # 换 runner 镜像后若三者都缺失，构建会静默退化，这里把它变成硬失败
      - name: Verify exe icon resource
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          Get-ChildItem target/release/build -Directory -Filter 'icon-tool-*' | ForEach-Object {
            $log = Join-Path $_.FullName 'output'
            if (Test-Path $log) { Write-Host "== build script output"; Get-Content $log }
            $res = Join-Path $_.FullName 'out/app-icon.res'
            if (Test-Path $res) { Write-Host "app-icon.res: $((Get-Item $res).Length) 字节" }
            else { Write-Host "app-icon.res: 缺失" }
          }
          python tools/pe_resources.py dist/2icon.exe
          if ($LASTEXITCODE -ne 0) {
            Write-Error "dist/2icon.exe 缺少 RT_GROUP_ICON 图标资源"
            exit 1
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2icon-windows-x64
          path: |
            dist/2icon.exe
            dist/2icon-portable.zip
          if-no-files-found: error
          retention-days: 30

      # 版本标签：推标签就用该标签名；推主分支则按「日期.run_number」自动生成
      - name: Determine release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "本次发布标签: ${tag}"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          files: |
            dist/2icon.exe
            dist/2icon-portable.zip
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
