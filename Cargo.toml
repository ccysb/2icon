[package]
name = "icon-tool"
version = "2.0.0"
edition = "2021"
description = "图像/文件图标提取工具 —— 基于 ZSUI 的 Rust 原生实现"
readme = "README.md"
license = "MIT"
default-run = "icon-tool"

[[bin]]
name = "icon-tool"
path = "src/main.rs"

[dependencies]
zsui = { version = "0.3.0-alpha.2", default-features = false, features = ["window", "button", "label", "textbox", "checkbox", "radio", "slider", "progress", "image-preview", "scroll", "icon", "dialog", "clipboard", "style", "dark-mode", "tooltip", "toast", "number-box", "toggle", "canvas"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "ico"] }
resvg = "0.50.0"
usvg = "0.50.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_System_Ole", "Win32_UI_Shell_Common", "Win32_Storage_FileSystem"] }
webp = "0.3.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
